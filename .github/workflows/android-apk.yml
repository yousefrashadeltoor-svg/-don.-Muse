name: Build DON MUSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DON-MUSE-Android-Offline-GitHub-Actions.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: don-muse-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK without obsolete packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Extract the original DON MUSE project
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/DON-MUSE-Android-Offline-GitHub-Actions.zip"
          APP="$RUNNER_TEMP/don-muse-source"
          mkdir -p "$APP"
          unzip -q "$GITHUB_WORKSPACE/DON-MUSE-Android-Offline-GitHub-Actions.zip" -d "$APP"
          test -f "$APP/package.json"
          test -f "$APP/next.config.ts"
          test -f "$APP/scripts/package-android.mjs"
          test -f "$APP/android/app/src/main/cpp/CMakeLists.txt"
          test -f "$APP/android/app/src/main/java/fm/donmuse/app/MainActivity.kt"
          echo "DON_MUSE_APP=$APP" >> "$GITHUB_ENV"
          echo "Original Next.js and Android source files verified."

      - name: Download and verify the Android Node.js 24 runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ZIP="$RUNNER_TEMP/nodejs-mobile-android-24.22.1-0.zip"
          RUNTIME_DIR="$RUNNER_TEMP/nodejs-mobile-runtime"
          CHECKSUMS="$RUNNER_TEMP/nodejs-mobile-SHA256SUMS"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/nodejs-mobile-android-24.22.1-0.zip" \
            --output "$RUNTIME_ZIP"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/SHA256SUMS" \
            --output "$CHECKSUMS"
          echo "f661820960b5ab5cc6c2ae43f6c37de09a993a2c2b45430e4174edc38011453c  $CHECKSUMS" | sha256sum --check
          EXPECTED_SHA="$(awk '$2 == "nodejs-mobile-android-24.22.1-0.zip" { print $1 }' "$CHECKSUMS")"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          ACTUAL_SHA="$(sha256sum "$RUNTIME_ZIP" | cut -d ' ' -f 1)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p "$RUNTIME_DIR"
          unzip -q "$RUNTIME_ZIP" -d "$RUNTIME_DIR"
          LIBNODE="$(find "$RUNTIME_DIR" -type f -path '*/arm64-v8a/libnode.so' -print -quit)"
          NODE_HEADER="$(find "$RUNTIME_DIR" -type f -name node.h -print -quit)"
          test -n "$LIBNODE"
          test -n "$NODE_HEADER"
          JNI_DIR="$DON_MUSE_APP/android/app/src/main/jniLibs/arm64-v8a"
          INCLUDE_DIR="$DON_MUSE_APP/android/app/src/main/cpp/node-include"
          mkdir -p "$JNI_DIR" "$INCLUDE_DIR"
          install -m 0644 "$LIBNODE" "$JNI_DIR/libnode.so"
          cp -a "$(dirname "$NODE_HEADER")/." "$INCLUDE_DIR/"
          test -s "$INCLUDE_DIR/node.h"
          test -s "$JNI_DIR/libnode.so"
          du -h "$JNI_DIR/libnode.so"

      - name: Install website dependencies
        working-directory: ${{ env.DON_MUSE_APP }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Configure image delivery for Android runtime
        working-directory: ${{ env.DON_MUSE_APP }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("next.config.ts")
          source = p.read_text(encoding="utf-8")
          setting = '  images: { unoptimized: true },\n'
          if setting.strip() not in source:
              marker = '  output: "standalone",\n'
              if source.count(marker) != 1:
                  raise SystemExit("Could not safely locate Next.js standalone config")
              source = source.replace(marker, marker + setting, 1)
              p.write_text(source, encoding="utf-8")
          print("Android build serves original image URLs without Linux-only sharp binaries")
          PY

      - name: Build the original Next.js website
        working-directory: ${{ env.DON_MUSE_APP }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
          DATABASE_URL: "local"
        run: npm run build

      - name: Package the original website for Android
        working-directory: ${{ env.DON_MUSE_APP }}
        run: node scripts/package-android.mjs

      - name: Remove duplicate and host-only files from Android server bundle
        working-directory: ${{ env.DON_MUSE_APP }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          import os

          assets = Path("android/app/src/main/assets")
          archive = assets / "donmuse-server.zip"
          optimized = assets / "donmuse-server.optimized.zip"
          removed_count = 0

          def exclude(name: str) -> bool:
              path = PurePosixPath(name)
              parts = path.parts
              if name.startswith(("android/", ".github/", "src/", "scripts/")):
                  return True
              if path.suffix == ".map":
                  return True
              if path.name == "ffmpeg" and any(part.startswith("ffmpeg-static") for part in parts):
                  return True
              if "node_modules" in parts:
                  i = parts.index("node_modules")
                  sub = parts[i + 1:]
                  if sub and sub[0] in {"tsx", "@esbuild-kit", "@esbuild", "esbuild"}:
                      return True
                  if len(sub) >= 2 and sub[0] == ".bin" and sub[1] == "esbuild":
                      return True
                  if sub and sub[0] == "sharp":
                      return True
                  if len(sub) >= 2 and sub[0] == "@img" and sub[1].startswith("sharp-"):
                      return True
              return False

          with ZipFile(archive, "r") as source, ZipFile(
              optimized, "w", compression=ZIP_DEFLATED, compresslevel=9, allowZip64=True
          ) as target:
              for info in source.infolist():
                  if exclude(info.filename):
                      removed_count += 1
                      continue
                  data = source.read(info.filename)
                  copied = info
                  copied.compress_type = ZIP_DEFLATED
                  target.writestr(copied, data, compress_type=ZIP_DEFLATED, compresslevel=9)

          with ZipFile(optimized, "r") as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f"Optimized server archive failed CRC check: {bad}")
              names = set(check.namelist())
              required = {
                  "server.js",
                  "package.json",
                  ".next/BUILD_ID",
                  "node_modules/next/package.json",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"Optimized server archive is missing required files: {sorted(missing)}")
              if any(n.startswith("android/") for n in names):
                  raise SystemExit("Android source/runtime duplicate remains in the website archive")
              if any(PurePosixPath(n).name == "ffmpeg" and any(part.startswith("ffmpeg-static") for part in PurePosixPath(n).parts) for n in names):
                  raise SystemExit("Host FFmpeg executable remains in the Android website archive")

          os.replace(optimized, archive)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (assets / "donmuse-server.sha256").write_text(digest + "\n", encoding="utf-8")
          print(f"Removed {removed_count} non-runtime/duplicate files")
          print(f"Optimized website bundle: {archive.stat().st_size / 1024 / 1024:.2f} MiB")
          print(f"Updated embedded server SHA-256: {digest}")
          PY

      - name: Align project with the pinned Android NDK
        working-directory: ${{ env.DON_MUSE_APP }}
        run: |
          sed -i 's/ndkVersion = "27.0.12077973"/ndkVersion = "27.3.13750724"/' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.3.13750724"' android/app/build.gradle.kts

      - name: Correct Android CMake argument scope
        working-directory: ${{ env.DON_MUSE_APP }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle.kts")
          source = gradle_file.read_text(encoding="utf-8")
          misplaced = '            arguments += listOf("-DANDROID_STL=c++_shared")\n'
          target = '        ndk { abiFilters += listOf("arm64-v8a") }\n'
          if source.count(misplaced) != 1:
              raise SystemExit("Expected exactly one misplaced CMake arguments line")
          if source.count(target) != 1:
              raise SystemExit("Could not find the Android ABI filter block")
          source = source.replace(misplaced, "", 1)
          replacement = target + (
              "        externalNativeBuild {\n"
              "            cmake { arguments += listOf(\"-DANDROID_STL=c++_shared\") }\n"
              "        }\n"
          )
          source = source.replace(target, replacement, 1)
          gradle_file.write_text(source, encoding="utf-8")
          print("Moved ANDROID_STL into defaultConfig.externalNativeBuild.cmake")

          activity = Path("android/app/src/main/java/fm/donmuse/app/MainActivity.kt")
          kotlin = activity.read_text(encoding="utf-8")
          bridge_import = "import fm.donmuse.app.runtime.DonMuseNativeBridge"
          if bridge_import not in kotlin:
              package_line = "package fm.donmuse.app\n"
              if not kotlin.startswith(package_line):
                  raise SystemExit("Unexpected MainActivity.kt package declaration")
              kotlin = kotlin.replace(package_line, package_line + "\n" + bridge_import + "\n", 1)
              activity.write_text(kotlin, encoding="utf-8")
          print("Ensured MainActivity imports DonMuseNativeBridge")

          cmake_file = Path("android/app/src/main/cpp/CMakeLists.txt")
          cmake = cmake_file.read_text(encoding="utf-8")
          old_standard = "target_compile_features(donmuse_node_bridge PRIVATE cxx_std_17)"
          new_standard = "target_compile_features(donmuse_node_bridge PRIVATE cxx_std_20)"
          if old_standard not in cmake and new_standard not in cmake:
              raise SystemExit("Could not find expected CMake C++ standard")
          if old_standard in cmake:
              cmake = cmake.replace(old_standard, new_standard, 1)
              cmake_file.write_text(cmake, encoding="utf-8")
          print("Configured native Node bridge for C++20")
          PY

      - name: Assemble the Android APK
        working-directory: ${{ env.DON_MUSE_APP }}/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contents and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$DON_MUSE_APP/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnode.so'
          unzip -l "$APK" | grep -q 'assets/donmuse-server.zip'
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/DON-MUSE-Android-arm64.apk"
          (cd "$GITHUB_WORKSPACE/release" && sha256sum DON-MUSE-Android-arm64.apk > SHA256SUMS.txt)
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-MUSE-Android-APK
          path: |
            release/DON-MUSE-Android-arm64.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
