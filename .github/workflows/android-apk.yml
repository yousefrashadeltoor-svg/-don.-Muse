name: Build DON MUSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DON-MUSE-Android-Offline-GitHub-Actions.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: don-muse-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK without obsolete packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Extract the original DON MUSE project
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/DON-MUSE-Android-Offline-GitHub-Actions.zip"
          APP="$RUNNER_TEMP/don-muse-source"
          mkdir -p "$APP"
          unzip -q "$GITHUB_WORKSPACE/DON-MUSE-Android-Offline-GitHub-Actions.zip" -d "$APP"
          test -f "$APP/package.json"
          test -f "$APP/next.config.ts"
          test -f "$APP/scripts/package-android.mjs"
          test -f "$APP/android/app/src/main/cpp/CMakeLists.txt"
          test -f "$APP/android/app/src/main/java/fm/donmuse/app/MainActivity.kt"
          echo "DON_MUSE_APP=$APP" >> "$GITHUB_ENV"
          echo "Original Next.js and Android source files verified."

      - name: Download and verify the Android Node.js 24 runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ZIP="$RUNNER_TEMP/nodejs-mobile-android-24.22.1-0.zip"
          RUNTIME_DIR="$RUNNER_TEMP/nodejs-mobile-runtime"
          CHECKSUMS="$RUNNER_TEMP/nodejs-mobile-SHA256SUMS"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/nodejs-mobile-android-24.22.1-0.zip" \
            --output "$RUNTIME_ZIP"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/SHA256SUMS" \
            --output "$CHECKSUMS"
          echo "f661820960b5ab5cc6c2ae43f6c37de09a993a2c2b45430e4174edc38011453c  $CHECKSUMS" | sha256sum --check
          EXPECTED_SHA="$(awk '$2 == "nodejs-mobile-android-24.22.1-0.zip" { print $1 }' "$CHECKSUMS")"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          ACTUAL_SHA="$(sha256sum "$RUNTIME_ZIP" | cut -d ' ' -f 1)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p "$RUNTIME_DIR"
          unzip -q "$RUNTIME_ZIP" -d "$RUNTIME_DIR"
          LIBNODE="$(find "$RUNTIME_DIR" -type f -path '*/arm64-v8a/libnode.so' -print -quit)"
          NODE_HEADER="$(find "$RUNTIME_DIR" -type f -name node.h -print -quit)"
          test -n "$LIBNODE"
          test -n "$NODE_HEADER"
          JNI_DIR="$DON_MUSE_APP/android/app/src/main/jniLibs/arm64-v8a"
          INCLUDE_DIR="$DON_MUSE_APP/android/app/src/main/cpp/node-include"
          mkdir -p "$JNI_DIR" "$INCLUDE_DIR"
          install -m 0644 "$LIBNODE" "$JNI_DIR/libnode.so"
          cp -a "$(dirname "$NODE_HEADER")/." "$INCLUDE_DIR/"
          test -s "$INCLUDE_DIR/node.h"
          test -s "$JNI_DIR/libnode.so"
          du -h "$JNI_DIR/libnode.so"

      - name: Install website dependencies
        working-directory: ${{ env.DON_MUSE_APP }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build the original Next.js website
        working-directory: ${{ env.DON_MUSE_APP }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
          DATABASE_URL: "local"
        run: npm run build

      - name: Package the original website for Android
        working-directory: ${{ env.DON_MUSE_APP }}
        run: node scripts/package-android.mjs

      - name: Align project with the pinned Android NDK
        working-directory: ${{ env.DON_MUSE_APP }}
        run: |
          sed -i 's/ndkVersion = "27.0.12077973"/ndkVersion = "27.3.13750724"/' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.3.13750724"' android/app/build.gradle.kts

      - name: Correct Android CMake argument scope
        working-directory: ${{ env.DON_MUSE_APP }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle.kts")
          source = gradle_file.read_text(encoding="utf-8")
          misplaced = '            arguments += listOf("-DANDROID_STL=c++_shared")\n'
          target = '        ndk { abiFilters += listOf("arm64-v8a") }\n'
          if source.count(misplaced) != 1:
              raise SystemExit("Expected exactly one misplaced CMake arguments line")
          if source.count(target) != 1:
              raise SystemExit("Could not find the Android ABI filter block")
          source = source.replace(misplaced, "", 1)
          replacement = target + (
              "        externalNativeBuild {\n"
              "            cmake { arguments += listOf(\"-DANDROID_STL=c++_shared\") }\n"
              "        }\n"
          )
          source = source.replace(target, replacement, 1)
          gradle_file.write_text(source, encoding="utf-8")
          print("Moved ANDROID_STL into defaultConfig.externalNativeBuild.cmake")

          activity = Path("android/app/src/main/java/fm/donmuse/app/MainActivity.kt")
          kotlin = activity.read_text(encoding="utf-8")
          bridge_import = "import fm.donmuse.app.runtime.DonMuseNativeBridge"
          if bridge_import not in kotlin:
              package_line = "package fm.donmuse.app\n"
              if not kotlin.startswith(package_line):
                  raise SystemExit("Unexpected MainActivity.kt package declaration")
              kotlin = kotlin.replace(package_line, package_line + "\n" + bridge_import + "\n", 1)
              activity.write_text(kotlin, encoding="utf-8")
          print("Ensured MainActivity imports DonMuseNativeBridge")
          PY

      - name: Assemble the Android APK
        working-directory: ${{ env.DON_MUSE_APP }}/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contents and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$DON_MUSE_APP/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnode.so'
          unzip -l "$APK" | grep -q 'assets/donmuse-server.zip'
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/DON-MUSE-Android-arm64.apk"
          (cd "$GITHUB_WORKSPACE/release" && sha256sum DON-MUSE-Android-arm64.apk > SHA256SUMS.txt)
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-MUSE-Android-APK
          path: |
            release/DON-MUSE-Android-arm64.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
